<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Expenses - PKV EAST CHIT
    </title>


    <!-- =============================================
         BOOTSTRAP
    ============================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =============================================
         COMMON MENU CSS
    ============================================== -->

    <link
        rel="stylesheet"
        href="css/menu.css"
    >


    <!-- =============================================
         COMMON MAIN CSS
    ============================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link rel="icon" href="data:,">

    <!-- =============================================
         EXPENSE PAGE STYLE
    ============================================== -->

    <style>

        body {

            background:
                #f4f6f9;

        }


        /* =========================================
           PAGE CONTAINER
        ========================================== */

        .page-container {

            width: 100%;

            max-width:
                1200px;

            margin:
                auto;

            padding:
                30px 20px 60px;

        }


        /* =========================================
           PAGE HEADER
        ========================================== */

        .page-header {

            background:
                white;

            border-radius:
                12px;

            padding:
                20px;

            margin-bottom:
                25px;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        .page-header h2 {

            margin:
                0;

            font-size:
                28px;

            font-weight:
                bold;

        }


        .page-header p {

            margin:
                8px 0 0;

            color:
                #6c757d;

        }


        /* =========================================
           COMMON CARD
        ========================================== */

        .content-card {

            background:
                white;

            border:
                none;

            border-radius:
                12px;

            padding:
                25px;

            margin-bottom:
                25px;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        /* =========================================
           CARD TITLE
        ========================================== */

        .content-card h5 {

            font-weight:
                600;

            margin-bottom:
                20px;

        }


        /* =========================================
           FORM
        ========================================== */

        .form-control {

            min-height:
                46px;

            border-radius:
                8px;

        }


        .form-label {

            font-weight:
                600;

        }


        textarea.form-control {

            min-height:
                100px;

        }


        /* =========================================
           BUTTON
        ========================================== */

        .save-expense-btn {

            min-height:
                46px;

            border-radius:
                8px;

            font-weight:
                600;

        }


        /* =========================================
           TABLE
        ========================================== */

        .table-container {

            overflow-x:
                auto;

            -webkit-overflow-scrolling:
                touch;

        }


        .table {

            margin:
                0;

        }


        .table th {

            background:
                #212529;

            color:
                white;

            white-space:
                nowrap;

        }


        .table th,
        .table td {

            padding:
                14px;

            vertical-align:
                middle;

            white-space:
                nowrap;

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (
            max-width: 768px
        ) {

            .page-container {

                padding:
                    20px 12px 40px;

            }


            .page-header h2 {

                font-size:
                    23px;

            }


            .content-card {

                padding:
                    18px;

            }

        }

    </style>

</head>


<body>


    <!-- =============================================
         COMMON MENU
    ============================================== -->

    <div id="appMenu"></div>



    <!-- =============================================
         MAIN CONTENT
    ============================================== -->

    <div class="app-content">


        <div class="page-container">


            <!-- =====================================
                 PAGE HEADER
            ====================================== -->

            <div class="page-header">

                <h2>

                    💸 Expense Management

                </h2>


                <p>

                    Add and manage business expenses

                </p>

            </div>



            <!-- =====================================
                 SUCCESS MESSAGE
            ====================================== -->

            <div
                id="expenseSuccess"
                class="
                    alert
                    alert-success
                    d-none
                "
            ></div>



            <!-- =====================================
                 ERROR MESSAGE
            ====================================== -->

            <div
                id="expenseError"
                class="
                    alert
                    alert-danger
                    d-none
                "
            ></div>



            <!-- =====================================
                 ADD EXPENSE CARD
            ====================================== -->

            <div class="content-card">


                <h5>

                    ➕ Add Expense

                </h5>


                <div class="row g-3">


                    <!-- CATEGORY -->

                    <div class="col-md-6">

                        <label
                            for="category"
                            class="form-label"
                        >

                            Expense Category

                        </label>


                        <input
                            type="text"
                            id="category"
                            class="form-control"
                            placeholder="
                                Example: Office Rent
                            "
                        >

                    </div>



                    <!-- AMOUNT -->

                    <div class="col-md-6">

                        <label
                            for="expenseAmount"
                            class="form-label"
                        >

                            Expense Amount

                        </label>


                        <input
                            type="number"
                            id="expenseAmount"
                            min="0"
                            step="0.01"
                            class="form-control"
                            placeholder="
                                Enter Amount
                            "
                        >

                    </div>



                    <!-- DATE -->

                    <div class="col-md-6">

                        <label
                            for="expenseDate"
                            class="form-label"
                        >

                            Expense Date

                        </label>


                        <input
                            type="date"
                            id="expenseDate"
                            class="form-control"
                        >

                    </div>



                    <!-- NOTE -->

                    <div class="col-md-6">

                        <label
                            for="expenseNote"
                            class="form-label"
                        >

                            Note

                        </label>


                        <input
                            type="text"
                            id="expenseNote"
                            class="form-control"
                            placeholder="
                                Optional Note
                            "
                        >

                    </div>



                    <!-- SAVE BUTTON -->

                    <div class="col-12">

                        <button
                            type="button"
                            class="
                                btn
                                btn-success
                                w-100
                                save-expense-btn
                            "
                            onclick="
                                addExpense()
                            "
                        >

                            💾 Save Expense

                        </button>

                    </div>


                </div>


            </div>



            <!-- =====================================
                 EXPENSE HISTORY
            ====================================== -->

            <div class="content-card">


                <div
                    class="
                        d-flex
                        justify-content-between
                        align-items-center
                        mb-3
                    "
                >

                    <h5 class="mb-0">

                        📋 Expense History

                    </h5>


                    <button
                        type="button"
                        class="
                            btn
                            btn-outline-primary
                            btn-sm
                        "
                        onclick="
                            showExpenses()
                        "
                    >

                        🔄 Refresh

                    </button>

                </div>



                <!-- TABLE -->

                <div class="table-container">


                    <table
                        class="
                            table
                            table-bordered
                            table-hover
                            align-middle
                        "
                    >


                        <thead>

                            <tr>

                                <th>
                                    #
                                </th>


                                <th>
                                    Category
                                </th>


                                <th>
                                    Amount
                                </th>


                                <th>
                                    Date
                                </th>


                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>



                        <tbody
                            id="expenseList"
                        >

                            <tr>

                                <td
                                    colspan="5"
                                    class="
                                        text-center
                                        text-muted
                                    "
                                >

                                    Loading Expenses...

                                </td>

                            </tr>

                        </tbody>


                    </table>


                </div>


            </div>


        </div>


    </div>



    <!-- =============================================
         COMMON MENU JS
    ============================================== -->

    <script
        type="module"
        src="js/menu.js"
    ></script>



    <!-- =============================================
         EXPENSE JS
    ============================================== -->

    <script
        type="module"
        src="js/expenses.js"
    ></script>


</body>

</html>

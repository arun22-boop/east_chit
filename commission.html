<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Commission Management - PKV EAST CHIT"
    >

    <meta
        name="theme-color"
        content="#212529"
    >

    <title>
        Commission - PKV EAST CHIT
    </title>


    <!-- =========================================
         BOOTSTRAP
    ========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =========================================
         COMMON MAIN CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- =========================================
         COMMON MENU CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/menu.css"
    >

    <link rel="icon" href="data:,">

    <!-- =========================================
         PAGE STYLE
    ========================================== -->

    <style>

        * {

            box-sizing: border-box;

        }


        html,
        body {

            width: 100%;

            min-height: 100%;

            margin: 0;

            padding: 0;

            overflow-x: hidden;

        }


        body {

            background: #f5f6f8;

            color: #212529;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =========================================
           MAIN CONTENT
        ========================================== */

        .app-content {

            width: calc(100% - 230px);

            min-height: 100vh;

            margin-left: 230px;

            padding:
                15px
                18px
                30px;

        }


        /* =========================================
           PAGE CONTAINER
        ========================================== */

        .page-container {

            width: 100%;

            max-width: none;

            margin: 0;

            padding: 0;

        }


        /* =========================================
           PAGE TITLE
        ========================================== */

        .page-title {

            margin:
                0
                0
                15px
                0;

            font-size: 25px;

            font-weight: 700;

            color: #212529;

        }


        /* =========================================
           COMMISSION CARD
        ========================================== */

        .commission-card {

            width: 100%;

            background: #ffffff;

            border-radius: 10px;

            padding: 18px;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.07
                );

        }


        .section-title {

            margin:
                0
                0
                18px
                0;

            font-size: 17px;

            font-weight: 700;

            color: #212529;

        }


        /* =========================================
           FORM GRID
        ========================================== */

        .commission-form-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 14px;

        }


        .form-group {

            width: 100%;

            min-width: 0;

        }


        .form-label {

            display: block;

            margin-bottom: 5px;

            font-size: 13px;

            font-weight: 600;

            color: #343a40;

        }


        /* =========================================
           FORM CONTROLS
        ========================================== */

        .form-control,
        .form-select {

            display: block;

            width: 100%;

            min-height: 44px;

            padding:
                9px
                12px;

            background: #ffffff;

            border:
                1px solid
                #ced4da;

            border-radius: 6px;

            outline: none;

            color: #212529;

            font-size: 14px;

        }


        .form-control:focus,
        .form-select:focus {

            border-color: #86b7fe;

            box-shadow:
                0 0 0 3px
                rgba(
                    13,
                    110,
                    253,
                    0.12
                );

        }


        /* =========================================
           AMOUNT INPUT
        ========================================== */

        .amount-input {

            background: #fff3cd;

            border-color: #ffca2c;

            color: #664d03;

            font-size: 16px;

            font-weight: 700;

        }


        /* =========================================
           BUTTONS
        ========================================== */

        .button-row {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

        }


        .btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 42px;

            padding:
                8px
                15px;

            border: none;

            border-radius: 6px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            text-decoration: none;

        }


        .btn-success {

            background: #198754;

            color: #ffffff;

        }


        .btn-secondary {

            background: #6c757d;

            color: #ffffff;

        }


        .btn-warning {

            background: #ffc107;

            color: #212529;

        }


        .btn-danger {

            background: #dc3545;

            color: #ffffff;

        }


        .btn-dark {

            background: #212529;

            color: #ffffff;

        }


        .btn:hover {

            opacity: 0.9;

        }


        /* =========================================
           HISTORY
        ========================================== */

        .history-card {

            width: 100%;

            margin-top: 15px;

            background: #ffffff;

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.06
                );

        }


        .history-header {

            padding:
                12px
                15px;

            background: #212529;

            color: #ffffff;

        }


        .history-header h5 {

            margin: 0;

            font-size: 16px;

            font-weight: 600;

        }


        /* =========================================
           TABLE
        ========================================== */

        .table-responsive {

            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;

        }


        .commission-table {

            width: 100%;

            min-width: 700px;

            border-collapse: collapse;

        }


        .commission-table th,
        .commission-table td {

            padding:
                9px
                10px;

            border:
                1px solid
                #dee2e6;

            white-space: nowrap;

            vertical-align: middle;

        }


        .commission-table th {

            background: #212529;

            color: #ffffff;

            font-size: 12px;

            text-align: left;

        }


        .commission-table td {

            font-size: 13px;

        }


        .commission-table tbody tr:hover {

            background: #f8f9fa;

        }


        /* =========================================
           ACTION BUTTONS
        ========================================== */

        .action-buttons {

            display: flex;

            gap: 5px;

        }


        .action-buttons .btn {

            min-height: 34px;

            padding:
                5px
                9px;

            font-size: 12px;

        }


        /* =========================================
           EMPTY MESSAGE
        ========================================== */

        .empty-message {

            padding: 25px !important;

            text-align: center;

            color: #6c757d;

        }


        /* =========================================
           BACK BUTTON
        ========================================== */

        .back-button {

            margin-top: 15px;

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 768px) {

            .app-content {

                width: 100%;

                margin-left: 0;

                padding: 12px;

            }


            .page-title {

                font-size: 22px;

                text-align: center;

            }


            .commission-form-grid {

                grid-template-columns: 1fr;

            }


            .button-row {

                flex-direction: column;

            }


            .button-row .btn {

                width: 100%;

            }


            .commission-table {

                min-width: 700px;

            }

        }


        /* =========================================
           SMALL MOBILE
        ========================================== */

        @media (max-width: 576px) {

            .app-content {

                padding: 8px;

            }


            .commission-card {

                padding: 13px;

                border-radius: 8px;

            }


            .form-label {

                font-size: 12px;

            }


            .form-control,
            .form-select {

                min-height: 43px;

                font-size: 14px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         COMMON MENU
    ========================================== -->

    <div id="appMenu"></div>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="app-content">

        <div class="page-container">


            <!-- =====================================
                 PAGE TITLE
            ====================================== -->

            <h2 class="page-title">

                💵 Group Commission

            </h2>


            <!-- =====================================
                 ADD COMMISSION
            ====================================== -->

            <section class="commission-card">


                <h5 class="section-title">

                    ➕ Add Commission

                </h5>


                <div class="commission-form-grid">


                    <!-- GROUP -->

                    <div class="form-group">

                        <label
                            for="commissionGroup"
                            class="form-label"
                        >

                            Select Group

                        </label>


                        <select
                            id="commissionGroup"
                            class="form-select"
                        >

                            <option value="">

                                Select Group

                            </option>

                        </select>

                    </div>


                    <!-- COMMISSION AMOUNT -->

                    <div class="form-group">

                        <label
                            for="commissionAmount"
                            class="form-label"
                        >

                            Commission Amount

                        </label>


                        <input
                            id="commissionAmount"
                            type="number"
                            min="0"
                            step="0.01"
                            class="form-control amount-input"
                            placeholder="Enter Commission Amount"
                            autocomplete="off"
                        >

                    </div>


                    <!-- DATE -->

                    <div class="form-group">

                        <label
                            for="commissionDate"
                            class="form-label"
                        >

                            Commission Date

                        </label>


                        <input
                            id="commissionDate"
                            type="date"
                            class="form-control"
                        >

                    </div>


                    <!-- ACTION -->

                    <div class="form-group">

                        <label class="form-label">

                            Action

                        </label>


                        <div class="button-row">


                            <button
                                type="button"
                                id="commissionSaveBtn"
                                class="btn btn-success"
                                onclick="addCommission()"
                            >

                                💾 Save Commission

                            </button>


                            <button
                                type="button"
                                class="btn btn-secondary"
                                onclick="clearCommissionForm()"
                            >

                                🔄 Clear

                            </button>


                        </div>

                    </div>


                </div>

            </section>


            <!-- =====================================
                 COMMISSION HISTORY
            ====================================== -->

            <section class="history-card">


                <div class="history-header">

                    <h5>

                        📋 Commission History

                    </h5>

                </div>


                <div class="table-responsive">


                    <table class="commission-table">


                        <thead>

                            <tr>

                                <th>
                                    #
                                </th>

                                <th>
                                    Group
                                </th>

                                <th>
                                    Amount
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="commissionList">

                            <tr>

                                <td
                                    colspan="5"
                                    class="empty-message"
                                >

                                    Loading Commission...

                                </td>

                            </tr>

                        </tbody>


                    </table>


                </div>


            </section>


            <!-- =====================================
                 BACK DASHBOARD
            ====================================== -->

            <a
                href="dashboard.html"
                class="btn btn-dark back-button"
            >

                ⬅️ Back Dashboard

            </a>


        </div>

    </main>


    <!-- =========================================
         COMMON MENU
    ========================================== -->

    <script
        src="js/menu.js"
    ></script>


    <!-- =========================================
         COMMISSION FIREBASE LOGIC
    ========================================== -->

    <script
        type="module"
        src="js/commission.js"
    ></script>


    <!-- =========================================
         DEFAULT DATE
    ========================================== -->

    <script>

        document.addEventListener(

            "DOMContentLoaded",

            function () {

                const date =
                    document.getElementById(
                        "commissionDate"
                    );


                if (
                    date &&
                    !date.value
                ) {

                    const today =
                        new Date();


                    const year =
                        today.getFullYear();


                    const month =
                        String(
                            today.getMonth() + 1
                        ).padStart(
                            2,
                            "0"
                        );


                    const day =
                        String(
                            today.getDate()
                        ).padStart(
                            2,
                            "0"
                        );


                    date.value =
                        `${year}-${month}-${day}`;

                }

            }

        );

    </script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reports - PKV EAST CHIT
    </title>


    <!-- =========================================
         BOOTSTRAP
    ========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =========================================
         MAIN CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- =========================================
         MENU CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/menu.css"
    >

    <link rel="icon" href="data:,">

    <!-- =========================================
         PAGE STYLE
    ========================================== -->

    <style>

        html,
        body {

            width: 100%;

            min-height: 100%;

            overflow-x: hidden;

        }


        body {

            background: #f8f9fa;

        }


        .page-container {

            max-width: 1200px;

            margin: auto;

            padding: 30px 20px 60px;

        }


        .card {

            border: none;

            border-radius: 12px;

        }


        .form-control,
        .form-select {

            min-height: 45px;

        }


        .table-responsive {

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;

        }


        .table th,
        .table td {

            vertical-align: middle;

            white-space: nowrap;

        }


        .report-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .report-actions .btn {

            min-width: 150px;

        }


        @media (max-width: 768px) {

            .page-container {

                padding: 20px 10px 50px;

            }


            h2 {

                font-size: 22px;

            }


            .report-actions {

                display: grid;

                grid-template-columns: 1fr;

            }


            .report-actions .btn {

                width: 100%;

            }


            .table {

                font-size: 14px;

            }

        }


        /* ========================================
           PRINT
        ======================================== */

        @media print {

            #appMenu,
            .report-actions,
            .back-dashboard {

                display: none !important;

            }


            body {

                background: #ffffff;

            }


            .app-content {

                margin: 0 !important;

                padding: 0 !important;

            }


            .page-container {

                max-width: 100%;

                padding: 0;

            }


            .card {

                box-shadow: none !important;

                border: 1px solid #000;

            }


            h2 {

                margin-bottom: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         COMMON MENU
    ========================================== -->

    <div id="appMenu"></div>



    <!-- =========================================
         PAGE CONTENT
    ========================================== -->

    <div class="app-content">

        <div class="page-container">


            <!-- =====================================
                 PAGE TITLE
            ====================================== -->

            <h2 class="text-center mb-4">

                👤 Reports

            </h2>



            <!-- =====================================
                 REPORT FILTERS
            ====================================== -->

            <div class="card shadow p-4">

                <h5 class="mb-4">

                   📋 Member Report

                </h5>



                <!-- MEMBER -->

                <label
                    for="reportMember"
                    class="form-label"
                >

                    Select Member

                </label>


                <select
                    id="reportMember"
                    class="form-select mb-3"
                    onchange="loadReport()"
                >

                    <option value="">

                        All Members

                    </option>

                </select>



                <!-- FROM DATE -->

                <label
                    for="fromDate"
                    class="form-label"
                >

                    From Date

                </label>


                <input
                    type="date"
                    id="fromDate"
                    class="form-control mb-3"
                    onchange="loadReport()"
                >



                <!-- TO DATE -->

                <label
                    for="toDate"
                    class="form-label"
                >

                    To Date

                </label>


                <input
                    type="date"
                    id="toDate"
                    class="form-control mb-4"
                    onchange="loadReport()"
                >



                <!-- =================================
                     ACTION BUTTONS
                ================================== -->

                <div class="report-actions">

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="window.print()"
                    >

                        🖨️ Print Report

                    </button>


                    <button
                        type="button"
                        class="btn btn-danger"
                        onclick="downloadPDF()"
                    >

                        📄 Download PDF

                    </button>


                    <button
                        type="button"
                        class="btn btn-success"
                        onclick="downloadExcel()"
                    >

                        👤 Download Excel

                    </button>

                </div>


            </div>



            <!-- =====================================
                 ACCOUNT REPORT
            ====================================== -->

            <div class="card shadow mt-4">

                <div class="card-header bg-dark text-white">

                    <h5 class="mb-0">

                        Account Report

                    </h5>

                </div>



                <div class="table-responsive">

                    <table
                        id="reportTable"
                        class="table table-bordered table-hover mb-0"
                    >

                        <thead class="table-dark">

                            <tr>

                                <th>
                                    Member
                                </th>

                                <th>
                                    Group
                                </th>

                                <th>
                                    Installment
                                </th>

                                <th>
                                    Collection Paid
                                </th>

                                <th>
                                    Pending Balance
                                </th>

                            </tr>

                        </thead>


                        <tbody id="reportList">

                            <tr>

                                <td
                                    colspan="5"
                                    class="text-center text-muted"
                                >

                                    Loading Report...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>



            <!-- =====================================
                 BACK DASHBOARD
            ====================================== -->

            <a
                href="dashboard.html"
                class="btn btn-secondary mt-4 back-dashboard"
            >

                ⬅️ Back Dashboard

            </a>


        </div>

    </div>



    <!-- =========================================
         XLSX
    ========================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
    ></script>



    <!-- =========================================
         JSPDF
    ========================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    ></script>



    <!-- =========================================
         JSPDF AUTOTABLE
    ========================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"
    ></script>



    <!-- =========================================
         COMMON MENU JS
    ========================================== -->

    <script
        src="js/menu.js"
    ></script>



    <!-- =========================================
         REPORT JS
    ========================================== -->

    <script type="module" src="js/reports.js"></script>


</body>

</html>

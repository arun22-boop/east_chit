<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Groups - PKV EAST CHIT
    </title>


    <!-- =========================================
         BOOTSTRAP
    ========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =========================================
         MAIN CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- =========================================
         MENU CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/menu.css"
    >

    <link rel="icon" href="data:,">

    <!-- =========================================
         PAGE STYLE
    ========================================== -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #f4f6f9;

            font-family:
                Arial,
                sans-serif;

            overflow-x: hidden;

        }


        /* =====================================
           MAIN CONTENT
        ====================================== */

        .app-content {

            min-height: 100vh;

            padding: 25px;

        }


        /* =====================================
           PAGE CONTAINER
        ====================================== */

        .page-container {

            width: 100%;

            max-width: 1400px;

            margin: auto;

        }


        /* =====================================
           PAGE HEADER
        ====================================== */

        .page-header {

            background: white;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 25px;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        .page-header h2 {

            margin: 0;

            font-size: 28px;

            font-weight: bold;

            color: #212529;

        }


        .page-header p {

            margin:
                8px
                0
                0;

            color: #6c757d;

            font-size: 16px;

        }


        /* =====================================
           CARDS
        ====================================== */

        .card {

            border: none;

            border-radius: 12px;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

            transition: 0.2s;

        }


        .card:hover {

            box-shadow:
                0 5px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );

        }


        /* =====================================
           CARD TITLE
        ====================================== */

        .section-title {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 20px;

        }


        /* =====================================
           FORM
        ====================================== */

        label {

            font-weight: 600;

            margin-bottom: 7px;

        }


        .form-control {

            min-height: 45px;

            border-radius: 8px;

        }


        .form-control:focus {

            box-shadow:
                0 0 0 0.2rem
                rgba(
                    13,
                    110,
                    253,
                    0.15
                );

        }


        .readonly-field {

            background: #eeeeee;

            cursor: not-allowed;

        }


        /* =====================================
           BUTTON
        ====================================== */

        .btn {

            border-radius: 8px;

            min-height: 42px;

        }


        /* =====================================
           FIREBASE STATUS
        ====================================== */

        .firebase-status {

            font-size: 14px;

            border-radius: 10px;

        }


        /* =====================================
           CHIT NUMBER
        ====================================== */

        .chit-number {

            font-weight: bold;

        }


        /* =====================================
           PREVIEW BOX
        ====================================== */

        #currentMonthPreview {

            border-radius: 10px;

            margin-bottom: 20px;

        }


        /* =====================================
           TABLE
        ====================================== */

        .table-responsive {

            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;

        }


        .table {

            margin-bottom: 0;

        }


        .table th {

            vertical-align: middle;

            text-align: center;

            white-space: nowrap;

        }


        .table td {

            vertical-align: middle;

            text-align: center;

            white-space: nowrap;

        }


        /* =====================================
           TABLE HEADER
        ====================================== */

        .table-dark th {

            background: #212529;

        }


        /* =====================================
           ACTION BUTTONS
        ====================================== */

        .action-buttons {

            display: flex;

            gap: 5px;

            justify-content: center;

            flex-wrap: wrap;

        }


        /* =====================================
           MOBILE
        ====================================== */

        @media (
            max-width: 768px
        ) {

            .app-content {

                padding:
                    15px
                    10px
                    40px;

            }


            .page-header {

                padding: 16px;

                margin-bottom: 20px;

            }


            .page-header h2 {

                font-size: 22px;

            }


            .page-header p {

                font-size: 14px;

            }


            .card {

                border-radius: 10px;

            }


            .section-title {

                font-size: 18px;

            }


            .table {

                font-size: 13px;

            }


            #saveGroupBtn,
            #cancelEditBtn {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         COMMON MENU
    ========================================== -->

    <div id="appMenu"></div>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <div class="app-content">

        <div class="page-container">


            <!-- =====================================
                 PAGE HEADER
            ====================================== -->

            <div class="page-header">

                <h2>

                    👥 Group Management

                </h2>


                <p>

                    Create and manage PKV EAST CHIT groups

                </p>

            </div>


            <!-- =====================================
                 FIREBASE STATUS
            ====================================== -->

            <div
                id="firebaseStatus"
                class="alert alert-info firebase-status"
            >

                🔥 Connecting to Firebase...

            </div>


            <!-- =====================================
                 ADD / EDIT GROUP
            ====================================== -->

            <div
                class="
                    card
                    shadow-sm
                    p-4
                    mb-4
                "
            >


                <h5
                    id="formTitle"
                    class="section-title"
                >

                    ➕ Add New Group

                </h5>


                <!-- GROUP NAME -->

                <div class="mb-3">

                    <label
                        for="groupName"
                        class="form-label"
                    >

                        Group Name

                    </label>


                    <input
                        id="groupName"
                        type="text"
                        class="form-control"
                        placeholder="Enter Group Name"
                        autocomplete="off"
                    >

                </div>


                <!-- CHIT AMOUNT -->

                <div class="mb-3">

                    <label
                        for="amount"
                        class="form-label"
                    >

                        Chit Amount

                    </label>


                    <input
                        id="amount"
                        type="number"
                        min="1"
                        step="1"
                        class="form-control"
                        placeholder="Enter Chit Amount"
                    >

                </div>


                <!-- MEMBER COUNT -->

                <div class="mb-3">

                    <label
                        for="members"
                        class="form-label"
                    >

                        Member Count

                    </label>


                    <input
                        id="members"
                        type="number"
                        min="1"
                        step="1"
                        class="form-control"
                        placeholder="Enter Number of Members"
                    >

                </div>


                <!-- DURATION -->

                <div class="mb-3">

                    <label
                        for="duration"
                        class="form-label"
                    >

                        Group Duration

                        <small class="text-muted">

                            (Months)

                        </small>

                    </label>


                    <input
                        id="duration"
                        type="number"
                        min="1"
                        step="1"
                        class="form-control"
                        placeholder="Enter Group Duration in Months"
                    >

                </div>


                <!-- START DATE -->

                <div class="mb-3">

                    <label
                        for="startDate"
                        class="form-label"
                    >

                        Start Date

                    </label>


                    <input
                        id="startDate"
                        type="date"
                        class="form-control"
                    >

                </div>


                <!-- END DATE -->

                <div class="mb-3">

                    <label
                        for="endDate"
                        class="form-label"
                    >

                        End Date

                        <small class="text-muted">

                            (Automatic)

                        </small>

                    </label>


                    <input
                        id="endDate"
                        type="date"
                        class="
                            form-control
                            readonly-field
                        "
                        readonly
                    >

                </div>


                <!-- MONTH PREVIEW -->

                <div
                    id="currentMonthPreview"
                    class="alert alert-info"
                >

                    📅 Current Chit Month:

                    <strong
                        id="currentMonthText"
                    >

                        1

                    </strong>


                    <span class="mx-2">

                        |

                    </span>


                    🎫 Chit No:

                    <strong
                        id="chitNoText"
                        class="chit-number"
                    >

                        CHIT-001

                    </strong>

                </div>


                <!-- ACTION BUTTONS -->

                <div
                    class="
                        d-flex
                        flex-column
                        flex-md-row
                        gap-2
                    "
                >


                    <button
                        type="button"
                        id="saveGroupBtn"
                        class="btn btn-primary"
                    >

                        💾 Save Group

                    </button>


                    <button
                        type="button"
                        id="cancelEditBtn"
                        class="btn btn-secondary"
                        style="display:none;"
                    >

                        ❌ Cancel Edit

                    </button>


                </div>


            </div>


            <!-- =====================================
                 GROUP LIST
            ====================================== -->

            <div
                class="
                    card
                    shadow-sm
                    p-3
                "
            >


                <div
                    class="
                        d-flex
                        justify-content-between
                        align-items-center
                        mb-3
                    "
                >

                    <h5
                        class="
                            section-title
                            mb-0
                        "
                    >

                        📋 Group List

                    </h5>

                </div>


                <!-- TABLE -->

                <div class="table-responsive">

                    <table
                        class="
                            table
                            table-bordered
                            table-hover
                            align-middle
                            mb-0
                        "
                    >

                        <thead class="table-dark">

                            <tr>

                                <th>
                                    Group Name
                                </th>


                                <th>
                                    Amount
                                </th>


                                <th>
                                    Members
                                </th>


                                <th>
                                    Duration
                                </th>


                                <th>
                                    Start Date
                                </th>


                                <th>
                                    End Date
                                </th>


                                <th>
                                    Chit No
                                </th>


                                <th>
                                    Current Month
                                </th>


                                <th>
                                    Status
                                </th>


                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="groupList">

                            <tr>

                                <td
                                    colspan="10"
                                    class="
                                        text-center
                                        text-muted
                                    "
                                >

                                    🔥 Loading Groups...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>


            </div>


            <!-- =====================================
                 BACK BUTTON
            ====================================== -->

            <div class="mt-4">

                <a
                    href="dashboard.html"
                    class="btn btn-dark"
                >

                    ⬅️ Back Dashboard

                </a>

            </div>


        </div>

    </div>


    <!-- =========================================
         COMMON MENU JS
    ========================================== -->

    <script
        type="module"
        src="js/menu.js"
    ></script>


    <!-- =========================================
         GROUP JS
    ========================================== -->

    <script
        type="module"
        src="js/groups.js"
    ></script>


</body>

</html>

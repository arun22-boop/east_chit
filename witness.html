<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Witness - PKV EAST CHIT</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

    <!-- Menu CSS -->
    <link
        rel="stylesheet"
        href="css/menu.css">

</head>


<body>


<!-- ============================= -->
<!-- MENU -->
<!-- ============================= -->

<div id="appMenu"></div>


<!-- ============================= -->
<!-- MAIN CONTENT -->
<!-- ============================= -->

<div class="app-content">

    <div class="page-container">


        <!-- ============================= -->
        <!-- TITLE -->
        <!-- ============================= -->

        <h2 class="text-center">

            👥 Witness Management

        </h2>


        <!-- ============================= -->
        <!-- ADD WITNESS -->
        <!-- ============================= -->

        <div class="card shadow p-4 mt-4">

            <h5>

                ➕ Add Witness

            </h5>


            <!-- NAME -->

            <input
                id="witnessName"
                type="text"
                class="form-control mb-2"
                placeholder="Witness Name"
                autocomplete="off">


            <!-- MOBILE -->

            <input
                id="witnessMobile"
                type="tel"
                class="form-control mb-2"
                placeholder="Mobile Number"
                autocomplete="off">


            <!-- ADDRESS -->

            <textarea
                id="witnessAddress"
                class="form-control mb-3"
                placeholder="Address"
                rows="3"></textarea>


            <!-- SAVE BUTTON -->

            <button
                type="button"
                id="witnessSaveBtn"
                onclick="addWitness()"
                class="btn btn-success w-100">

                ➕ Save Witness

            </button>

        </div>


        <!-- ============================= -->
        <!-- WITNESS LIST -->
        <!-- ============================= -->

        <div class="card shadow mt-4 p-3">

            <h5>

               📋 Witness List

            </h5>


            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover mt-3 mb-0">

                    <thead class="table-dark">

                        <tr>

                            <th>
                                Name
                            </th>

                            <th>
                                Mobile
                            </th>

                            <th>
                                Address
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="witnessList">

                        <tr>

                            <td
                                colspan="4"
                                class="text-center text-muted">

                                Loading Witnesses...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- ============================= -->
        <!-- BACK -->
        <!-- ============================= -->

        <a
            href="dashboard.html"
            class="btn btn-dark mt-3">

            ⬅️ Back Dashboard

        </a>


    </div>

</div>


<!-- ============================= -->
<!-- MENU JS -->
<!-- ============================= -->

<script src="js/menu.js"></script>


<!-- ============================= -->
<!-- FIREBASE WITNESS JS -->
<!-- ============================= -->

<script
    type="module"
    src="js/witness.js">
</script>


</body>

</html>

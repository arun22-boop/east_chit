<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Dashboard - PKV EAST CHIT"
    >

    <meta
        name="theme-color"
        content="#212529"
    >

    <title>
        Dashboard - PKV EAST CHIT
    </title>


    <!-- ==========================================
         BOOTSTRAP
    =========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ==========================================
         COMMON APP STYLE
    =========================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- ==========================================
         COMMON MENU STYLE
    =========================================== -->

    <link
        rel="stylesheet"
        href="css/menu.css"
    >


    <!-- ==========================================
         FAVICON FIX
    =========================================== -->

    <link
        rel="icon"
        href="data:,"
    >

</head>


<body>


    <!-- ==========================================
         COMMON MENU
    =========================================== -->

    <div id="appMenu"></div>


    <!-- ==========================================
         MAIN APPLICATION CONTENT
    =========================================== -->

    <main class="app-content">


        <div class="page-container">


            <!-- ======================================
                 DASHBOARD HEADER
            ======================================= -->

            <section class="dashboard-header">

                <h2>

                    💰 PKV EAST CHIT

                </h2>


                <p>

                    Welcome Admin

                </p>

            </section>


            <!-- ======================================
                 ERROR MESSAGE
            ======================================= -->

            <div
                id="dashboardError"
                class="alert alert-danger d-none"
            ></div>


            <!-- ======================================
                 DASHBOARD SUMMARY CARDS
            ======================================= -->

            <div
                class="
                    row
                    g-3
                "
            >


                <!-- ===============================
                     TOTAL GROUPS
                ================================ -->

                <div
                    class="
                        col-6
                        col-md-4
                    "
                >

                    <div class="dashboard-card">

                        <div class="dashboard-card-title">

                            👥 Total Groups

                        </div>


                        <div
                            id="groups"
                            class="dashboard-card-value"
                        >

                            0

                        </div>

                    </div>

                </div>


                <!-- ===============================
                     TOTAL MEMBERS
                ================================ -->

                <div
                    class="
                        col-6
                        col-md-4
                    "
                >

                    <div class="dashboard-card">

                        <div class="dashboard-card-title">

                            👤 Total Members

                        </div>


                        <div
                            id="members"
                            class="dashboard-card-value"
                        >

                            0

                        </div>

                    </div>

                </div>


                <!-- ===============================
                     TOTAL COMMISSION
                ================================ -->

                <div
                    class="
                        col-6
                        col-md-4
                    "
                >

                    <div class="dashboard-card">

                        <div class="dashboard-card-title">

                            💵 Total Commission

                        </div>


                        <div
                            id="commission"
                            class="dashboard-card-value"
                        >

                            ₹0

                        </div>

                    </div>

                </div>


                <!-- ===============================
                     TOTAL EXPENSE
                ================================ -->

                <div
                    class="
                        col-6
                        col-md-4
                    "
                >

                    <div class="dashboard-card">

                        <div class="dashboard-card-title">

                            💸 Total Expense

                        </div>


                        <div
                            id="expense"
                            class="dashboard-card-value"
                        >

                            ₹0

                        </div>

                    </div>

                </div>


                <!-- ===============================
                     TOTAL COLLECTION
                ================================ -->

                <div
                    class="
                        col-6
                        col-md-4
                    "
                >

                    <div class="dashboard-card">

                        <div class="dashboard-card-title">

                            💰 Total Collection

                        </div>


                        <div
                            id="collection"
                            class="dashboard-card-value"
                        >

                            ₹0

                        </div>

                    </div>

                </div>


                <!-- ===============================
                     PENDING INSTALLMENT
                ================================ -->

                <div
                    class="
                        col-6
                        col-md-4
                    "
                >

                    <div class="dashboard-card">

                        <div class="dashboard-card-title">

                            📒 Pending Installment

                        </div>


                        <div
                            id="pending"
                            class="dashboard-card-value"
                        >

                            ₹0

                        </div>

                    </div>

                </div>


                <!-- ===============================
                     CASH IN HAND
                ================================ -->

                <div
                    class="
                        col-12
                        col-md-6
                    "
                >

                    <div
                        class="
                            dashboard-card
                            dashboard-card-large
                        "
                    >

                        <div class="dashboard-card-title">

                            💰 Cash In Hand

                        </div>


                        <div
                            id="cash"
                            class="dashboard-card-big-value"
                        >

                            ₹0

                        </div>

                    </div>

                </div>


                <!-- ===============================
                     FINAL TOTAL
                ================================ -->

                <div
                    class="
                        col-12
                        col-md-6
                    "
                >

                    <div
                        class="
                            dashboard-card
                            dashboard-final-card
                        "
                    >

                        <div class="dashboard-card-title">

                            📊 Final Total Amount

                        </div>


                        <div
                            id="finalTotal"
                            class="dashboard-card-big-value"
                        >

                            ₹0

                        </div>

                    </div>

                </div>


            </div>


        </div>


    </main>


    <!-- ==========================================
         COMMON MENU JS
    =========================================== -->

    <script
        src="js/menu.js"
    ></script>


    <!-- ==========================================
         DASHBOARD FIREBASE JS
    =========================================== -->

    <script
        type="module"
        src="js/dashboard.js"
    ></script>


</body>

</html>

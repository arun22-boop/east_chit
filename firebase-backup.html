<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Firebase Backup - PKV EAST CHIT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">

    <style>
        body {
            background: #f5f5f5;
        }

        .app-content {
            margin-left: 240px;
            width: calc(100% - 240px);
        }

        .page-container {
            width: 100%;
            padding: 25px;
        }

        .backup-card {
            max-width: 800px;
            margin: auto;
        }

        .backup-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid #ddd;
        }

        .backup-item:last-child {
            border-bottom: none;
        }

        .count {
            font-weight: bold;
            color: #0d6efd;
        }

        #backupStatus {
            min-height: 50px;
        }

        @media(max-width:768px) {

            .app-content {
                margin-left: 0;
                width: 100%;
            }

            .page-container {
                padding: 10px;
            }

            .backup-item {
                padding: 12px;
            }
        }
    </style>

</head>

<body>

<div id="appMenu"></div>

<div class="app-content">

    <div class="page-container">

        <h2 class="text-center mb-4">
            🔥 Firebase Backup
        </h2>

        <div class="card shadow backup-card">

            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">
                    📦 LocalStorage Data
                </h5>
            </div>

            <div class="card-body">

                <div id="backupList">

                    <div class="backup-item">
                        <span>👤 Members</span>
                        <span id="membersCount" class="count">0</span>
                    </div>

                    <div class="backup-item">
                        <span>👁️Witnesses</span>
                        <span id="witnessesCount" class="count">0</span>
                    </div>

                    <div class="backup-item">
                        <span>👥 Groups</span>
                        <span id="groupsCount" class="count">0</span>
                    </div>

                    <div class="backup-item">
                        <span>💰 Installments</span>
                        <span id="installmentsCount" class="count">0</span>
                    </div>

                    <div class="backup-item">
                        <span>💵 Collections</span>
                        <span id="collectionsCount" class="count">0</span>
                    </div>

                    <div class="backup-item">
                        <span>🏠 Commissions</span>
                        <span id="commissionsCount" class="count">0</span>
                    </div>

                    <div class="backup-item">
                        <span>💸 Expenses</span>
                        <span id="expensesCount" class="count">0</span>
                    </div>

                </div>

                <hr>

                <div id="backupStatus"
                     class="alert alert-secondary">
                    Ready for backup.
                </div>

                <button
                    id="backupBtn"
                    onclick="backupAllData()"
                    class="btn btn-primary w-100">

                    🔥 Backup All Data to Firebase

                </button>

                <button
                    onclick="location.reload()"
                    class="btn btn-outline-secondary w-100 mt-2">

                    🔄 Refresh

                </button>

                <a
                    href="dashboard.html"
                    class="btn btn-dark w-100 mt-2">

                    ⬅️ Back Dashboard

                </a>

            </div>

        </div>

    </div>

</div>

<script src="js/menu.js"></script>

<script type="module"
        src="js/firebase-backup.js"></script>

</body>

</html>
